<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>مغامرة أبطال المعرفة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@400;700&family=Readex+Pro:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#1b2340;color-scheme:light}
*,*::before,*::after{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:"Alan Sans","Readex Pro","Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink);background:linear-gradient(160deg,#dfe9ff,#fff3cf 60%,#ffe0e6);min-height:100vh;overflow-x:hidden;font-size:18px}
.wrap{max-width:1200px;margin:auto;padding:12px}.card{background:#fff;border-radius:20px;box-shadow:0 6px 18px #1b234026;padding:14px;margin-bottom:12px}
h1{margin:0;font-size:clamp(24px,5vw,38px);color:#3b2bb5}h2{margin:.2em 0}.hd{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap}.hd img{height:90px}
.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}label{display:block;font-weight:700;font-size:15px}
input,select,textarea{width:100%;font:inherit;padding:10px;border:2px solid #b9c4e8;border-radius:12px;background:#fff;color:var(--ink)}input[type=checkbox]{width:22px;height:22px;vertical-align:middle}input[type=color]{padding:2px;height:46px}
button{font:inherit;cursor:pointer;min-height:52px;padding:8px 16px;border-radius:14px;border:0;background:#e6ebff;color:var(--ink);font-weight:700;box-shadow:0 4px 0 #b9c4e8}
button.pri{background:linear-gradient(#ffd24a,#f5a800);box-shadow:0 5px 0 #b27700;font-size:22px}button:disabled{opacity:.55;cursor:not-allowed}
:focus-visible{outline:4px solid #7c3aed;outline-offset:2px}.hint{font-size:14px;color:#556}.err{color:#c01;font-weight:700}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}.timer{font-size:24px}
.panels{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.ph{color:#fff;padding:8px 12px;border-radius:14px 14px 0 0;display:flex;justify-content:space-between;font-weight:800}
.pb{border:3px solid var(--tc);border-radius:0 0 14px 14px;padding:10px;background:#fff}.q{font-size:clamp(20px,3vw,28px);font-weight:800;margin:6px 0 10px}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.opt{text-align:start;min-height:58px;font-size:20px;background:#eef2ff}
.opt.good{background:#b6f0c4;box-shadow:0 4px 0 #2a9d4b}.opt.bad{background:#ffc2c2;box-shadow:0 4px 0 #c33}
.fb{margin-top:8px;padding:8px;border-radius:12px;font-weight:700;background:#fff3cf}.fb.ok{background:#c9f5d4}.fb.no{background:#ffd9d9}
.lane{position:relative;height:150px;margin:8px 0;border-radius:16px;background:linear-gradient(#bfe6ff,#e8f7ff);overflow:hidden;border:3px solid var(--tc)}
.cells{position:absolute;inset:auto 70px 24px 70px;display:flex;gap:4px;align-items:flex-end;height:90px}.cell{flex:1;background:#fff;border:2px dashed #9aa;border-radius:6px;min-height:22px;text-align:center;font-style:normal;font-weight:800}
.cell.f{background:var(--tc);border:2px solid var(--tc);color:#fff}.cells:not(:has(.st)) .cell{height:26px}
.ch{position:absolute;bottom:42px;height:96px}.goal{position:absolute;inset-inline-end:10px;bottom:30px;font-size:34px}
.water{position:absolute;inset:auto 0 0 0;height:20px;background:repeating-linear-gradient(90deg,#4aa8ff 0 20px,#7cc4ff 20px 40px);animation:w 3s linear infinite}@keyframes w{to{background-position:80px 0}}
.tug{display:flex;align-items:center;gap:8px}.tug img{height:130px}.rope{position:relative;flex:1;height:60px}.rope::before{content:"";position:absolute;inset:27px 0 auto;height:8px;background:repeating-linear-gradient(90deg,#a56b2a 0 8px,#c98c45 8px 16px);border-radius:4px}
.mid{position:absolute;left:50%;top:6px;bottom:6px;border-inline-start:3px dashed #555}.knot{position:absolute;top:14px;width:32px;height:32px;margin-left:-16px;border-radius:50%;background:#e11;border:3px solid #fff;transition:left .4s}
.xo{display:grid;grid-template-columns:repeat(3,minmax(70px,110px));gap:8px;justify-content:center;margin:10px auto}.xc{height:110px;font-size:60px;background:#fff;border:3px solid #7b8bd1}.xc:disabled{opacity:1}.xc.win{background:#fff0a8}
.ov{position:fixed;inset:0;background:#0007;display:grid;place-items:center;z-index:9;text-align:center}
.tbl{width:100%;border-collapse:collapse}.tbl th,.tbl td{padding:8px;border-bottom:1px solid #ccd;text-align:center}.ban{font-size:clamp(22px,4vw,34px);font-weight:800;text-align:center;color:#3b2bb5}
.qi{display:flex;gap:6px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #dde;padding:6px 0}.qi span{flex:1;min-width:160px}.qi button{min-height:40px;font-size:15px;padding:4px 10px}
.tag{background:#ffe08a;border-radius:8px;padding:1px 6px;font-size:13px}.simple .fb::after{content:""}
.rm *{animation:none!important;transition:none!important}.hide{display:none!important}
@media(max-width:640px){.hd img{height:64px}.cells{inset-inline:54px}.ch{height:76px}.tug img{height:80px}}
.act{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}.fill{margin-top:4px}.fb{margin-top:16px}.opts{margin-bottom:4px}
.wheelw{position:relative;width:min(80vw,300px);margin:6px auto 12px}.ptr{position:absolute;top:-16px;inset-inline:0;text-align:center;font-size:32px;color:#c01;z-index:2;line-height:1}
.wheel{aspect-ratio:1;border-radius:50%;border:6px solid #3b2bb5;position:relative;background:conic-gradient(#8fe3a0 0 60deg,#ffe27a 60deg 120deg,#ff9b9b 120deg 180deg,#8fe3a0 180deg 240deg,#ffe27a 240deg 300deg,#ff9b9b 300deg 360deg)}
.wheel b{position:absolute;top:50%;left:50%;font-size:15px;text-align:center;line-height:1.2}
.sb{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;direction:ltr;max-width:480px;margin:8px auto}.sc{aspect-ratio:1;background:#fff;border:2px solid #b9c4e8;border-radius:10px;font-size:12px;text-align:center;display:flex;flex-direction:column;justify-content:center;min-width:0}
.sc.lad{background:#d6f7dc}.sc.snk{background:#ffdede}.sc em{font-style:normal;font-size:20px;font-weight:800}.sc small{font-weight:800;font-size:13px}
.die{font-size:72px;display:inline-block;line-height:1}.die.roll{animation:dr .9s}@keyframes dr{to{transform:rotate3d(1,1,0,720deg)}}
label{line-height:1.6;font-size:16px}label>input:not([type=checkbox]),label>select,label>textarea{margin-top:8px}
input[type=checkbox]{margin-inline-end:10px}input,select,textarea{padding:12px 14px}.card{padding:20px}.g{gap:16px 14px}#rule{margin:18px 0}
body{line-height:1.6}.card>*+*{margin-top:16px}.card>p,.card>h2,.ban{margin-block:0}.card>h2+*{margin-top:12px}
.card>*+*.ban{margin-top:12px}.bar>*,.hd>*,.tug>*{margin:0!important}.bar>span:last-child{display:flex;gap:10px;flex-wrap:wrap}
button{padding:12px 20px;line-height:1.5}.opt{padding:14px 18px}.card>button,.card p button{margin:16px 6px 0}.pb>*+*{margin-top:14px}.card .hint{font-size:15px}.wheel b{white-space:nowrap}
.pav{height:100px;display:block;margin:10px auto 0}
.sb3d{perspective:1100px;padding:8px 4px 26px}.sbw{position:relative;direction:ltr;aspect-ratio:6/5;width:100%;max-width:560px;margin:0 auto;transform:rotateX(26deg);transform-style:preserve-3d;border:9px solid #8a5a2b;border-radius:16px;background:#8a5a2b;box-shadow:0 28px 34px #0005,inset 0 0 0 2px #c58a4a}
.sbg{position:absolute;inset:0;display:grid;grid-template:repeat(5,1fr)/repeat(6,1fr)}.tl{margin:1.5px;border-radius:8px;font-weight:800;font-size:clamp(10px,2.4vw,13px);text-align:start;padding:3px 6px;box-shadow:inset 0 -5px 0 #0002,inset 0 2px 0 #fff8}
.ta{background:linear-gradient(#fff2c2,#ffe08a)}.tb{background:linear-gradient(#d9efff,#a9d6ff)}.tl.gl{background:linear-gradient(#ffe36b,#ffb300)}
.art{position:absolute;inset:0;width:100%;height:100%;transform:translateZ(6px);pointer-events:none;overflow:visible}
.pw{position:absolute;transform-origin:50% 100%;transform:translate(-50%,-92%) rotateX(-26deg);transition:left .8s ease-in-out,top .8s ease-in-out;z-index:3;text-align:center;pointer-events:none}
.pw img{height:clamp(46px,11vw,78px);display:block;filter:drop-shadow(0 4px 3px #0006)}.pw i{display:block;width:34px;height:10px;border-radius:50%;margin:-6px auto 0;opacity:.85;box-shadow:0 2px 4px #0005}.pw b{position:absolute;top:-16px;inset-inline:0;font-size:16px}
.dw{perspective:500px;display:inline-block;width:80px;height:80px;margin:22px 0 14px}.cube{width:70px;height:70px;margin:5px;position:relative;transform-style:preserve-3d;transform:rotateX(-22deg) rotateY(-28deg) var(--r)}
.cube.roll{animation:tumble .9s ease-out}@keyframes tumble{from{transform:rotateX(-22deg) rotateY(-28deg) rotateX(720deg) rotateY(540deg) var(--r)}to{transform:rotateX(-22deg) rotateY(-28deg) var(--r)}}
.df{position:absolute;inset:0;background:linear-gradient(135deg,#fff,#dfe5f5);border:2px solid #c3cbe6;border-radius:12px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:9px;backface-visibility:hidden}
.dp{width:11px;height:11px;border-radius:50%;background:#1b2340;place-self:center;visibility:hidden}.dp.on{visibility:visible}
.scn{position:relative;aspect-ratio:3/1;border:3px solid var(--tc,#3b2bb5);border-radius:16px;overflow:hidden;box-shadow:0 16px 20px #0004;transform:perspective(900px) rotateX(7deg);transform-origin:50% 100%;background:#9cf;margin-bottom:22px}
.scn svg{position:absolute;inset:0;width:100%;height:100%}.ch3{position:absolute;height:40%;transform:translateX(-50%);transition:left .9s ease-in-out,bottom .9s ease-in-out;z-index:2}
.ch3 img{height:100%;display:block;filter:drop-shadow(0 4px 3px #0006)}.ch3 i{position:absolute;left:50%;bottom:-3px;width:60%;height:8%;transform:translateX(-50%);border-radius:50%;opacity:.8;z-index:-1}
.wv{animation:wvm 3s linear infinite}@keyframes wvm{to{transform:translateX(-40px)}}
</style></head><body>
<div class="wrap" id="app">
<section id="setup">
<div class="card hd"><img id="i0" alt=""><div style="text-align:center"><h1>🏆 مغامرة أبطال المعرفة</h1><div class="hint">لعبة تعليمية لأي مادة وأي صف</div></div><img id="i1" alt=""></div>
<div class="card"><h2>إعداد اللعبة</h2><div class="g">
<div><label>المادة<input id="subj" placeholder="مثال: الكيمياء"></label></div>
<div><label>عنوان الدرس<input id="lesson"></label></div>
<div><label>الصف<select id="grade"></select></label></div>
<div><label>مستوى الصعوبة<select id="diff"><option value="easy">سهل</option><option value="mid">متوسط</option><option value="graded" selected>متدرج</option></select></label></div>
<div><label>طريقة اللعب<select id="pm"><option value="" disabled selected>اختر طريقة اللعب</option><option value="two">فريقان يتنافسان</option><option value="single">لاعب واحد</option><option value="coop">تعاوني لفريق واحد</option><option value="online">أونلاين (لاعبان)</option></select></label></div>
<div><label>نمط اللعب<select id="mode"><option value="bridge">تحدي بناة الجسور</option><option value="tug">شد الحبل</option><option value="xo">XO التعليمية</option><option value="treasure">رحلة الكنز</option><option value="summit">سباق القمة</option><option value="wheel">عجلة التحديات</option><option value="snake">السلم والثعبان</option><option value="maze">متاهة المعرفة</option></select></label></div>
<div class="nm"><label><span id="ln1">اسم الفريق الأول</span> *<input id="n1" autocomplete="off"></label></div>
<div class="t2 nm"><label><span id="ln2">اسم الفريق الثاني</span> *<input id="n2" autocomplete="off"></label></div>
<div class="nm"><label>لون الفريق الأول (▲)<input type="color" id="c1" value="#1e5bd8"></label></div>
<div class="t2 nm"><label>لون الفريق الثاني (●)<input type="color" id="c2" value="#12a150"></label></div>
<div class="nm"><label>شخصية الفريق الأول<select id="a1"><option value="0" selected>👦 فتى (سترة زرقاء)</option><option value="1">👧 فتاة (فستان أسود)</option><option value="2">👦 فتى (سترة صفراء)</option><option value="3">🧕 فتاة (حجاب)</option></select></label><img id="pa1" class="pav" alt=""></div><div class="t2 nm"><label>شخصية الفريق الثاني<select id="a2"><option value="0">👦 فتى (سترة زرقاء)</option><option value="1" selected>👧 فتاة (فستان أسود)</option><option value="2">👦 فتى (سترة صفراء)</option><option value="3">🧕 فتاة (حجاب)</option></select></label><img id="pa2" class="pav" alt=""></div>
<div><label>عدد الأسئلة<input type="number" id="count" value="10" min="3" max="60"></label></div>
<div><label>مدة الجولة بالثواني (0 = بدون وقت)<input type="number" id="time" value="300" min="0"></label></div>
</div>
<p class="card" id="rule" style="background:#eef2ff"></p>
<div id="onl" class="card hide" style="background:#f3fff3"><h2>اللعب أونلاين</h2><p class="hint" id="ostat">اسمك وشخصيتك من خانات الفريق الأول. اختر لاعبًا ينتظر وأرسل له طلب انضمام، أو انتظر أنت لاعبًا.</p><div id="olist"></div><button id="ocr" type="button">أنتظر لاعبًا (أنا أستضيف)</button></div>
<div class="g"><label><input type="checkbox" id="snd" checked> تشغيل الصوت</label><label><input type="checkbox" id="rm"> تقليل الحركة</label><label><input type="checkbox" id="fx"> مؤثرات مبسّطة</label><label><input type="checkbox" id="retry" checked> رحلة الكنز: السماح بمحاولة أخرى</label></div>
<label>ملخص الدرس (للمرجع فقط؛ لا تُستخرج منه الأسئلة تلقائيًا)<textarea id="summary" rows="2"></textarea></label>
<p class="err" id="err"></p><button class="pri" id="go">ابدأ اللعبة</button></div>
<p id="lstat" class="hint" style="margin:0 6px 14px">أسئلة تجريبية (لم يُحدَّد درس)</p>
<div class="card hint">الفرق تحصل على الأسئلة نفسها بترتيب مختلف. أنشئ أسئلة درسك من صفحة الأداة builder.html.</div>
</section>
<section id="game" class="hide"></section><section id="result" class="hide"></section>
</div>
<script src="online-config.js"></script>

async function accept(k){const r=ON&&ON.host&&ON.reqs[k];if(!r||ON.guest)return;ON.guest={n:r.n,a:r.a,k};await ON.ref.child("guest").set(ON.guest);ON.lob.remove();
 Object.keys(ON.reqs).forEach(o=>{if(o!==k)ON.ref.child("rej/"+o).set(1)});ON.ref.child("req").remove();ost("تمت الموافقة، تبدأ اللعبة…");
 const c=readSettings();c.pm="two";c.n2=ON.guest.n;c.a2=+ON.guest.a;hostRun(c,Q)}
function reject(k){if(ON&&ON.host){ON.ref.child("rej/"+k).set(1);ON.ref.child("req/"+k).remove()}}
async function onJoin(id){if(!V("n1").trim()){ost("أدخل اسمك أولًا في خانة الاسم");return}if(ON)leaveOnline(true);try{await fbLoad()}catch(e){ost(e);return}stopLobby();
 const ref=DB.ref("rooms/"+id),sn=await ref.child("t").once("value");if(!sn.exists()){ost("لم يعد هذا اللاعب متاحًا.");startLobby();return}
 const key=ref.child("req").push().key;ON={host:false,me:1,id,ref,run:-1,offs:[],roff:[],key};goState();
 const rq=ref.child("req/"+key);await rq.set({n:V("n1").trim()||"اللاعب الثاني",a:+V("a1")});rq.onDisconnect().remove();
 ost('أُرسل الطلب. بانتظار موافقة المضيف…<div><button data-cancel="1">إلغاء الطلب</button></div>');
 const L=(r,f)=>{const cb=r.on("value",f);ON.offs.push(()=>r.off("value",cb))};
 L(ref.child("rej/"+key),s=>{if(s.exists()&&ON)leaveOnline(true,"رفض المضيف طلبك.")});
 L(ref.child("guest"),s=>{const g=s.val();if(ON&&g&&g.k===key&&!ON.acc){ON.acc=true;ref.child("guest").onDisconnect().remove();ost("تمت الموافقة، تبدأ اللعبة…")}});
 L(ref.child("cfg"),s=>{const c=s.val();if(c&&ON&&c.run!==ON.run)beginRun(c)});
 L(ref.child("t"),s=>{if(!s.exists()&&ON)leaveOnline(true,"غادر المضيف الغرفة.")})}
async function hostRun(c0,pool){const run=ON.lastRun+1;cfg=c0;Q=pool;const e=validate();if(e){$("#err").textContent=e;return}$("#err").textContent="";ON.lastRun=run;ON.cfg0=c0;ON.pool=pool;
 const c={run,seed:(Math.random()*2147483647)|0,cfg:c0,pool};await ON.ref.child("cfg").set(c);beginRun(c)}
function beginRun(c){ON.roff.forEach(f=>f());ON.roff=[];ON.run=c.run;ON.seq=0;ON.started=true;startGame(c);
 const base=ON.ref.child("r/"+c.run),A=base.child("a"),fa=A.on("child_added",s=>{const a=s.val();if(a&&a.run===ON.run)applyAct(a)});ON.roff.push(()=>A.off("child_added",fa));
 if(ON.host){const I=base.child("i"),fi=I.on("child_added",s=>{const a=s.val();s.ref.remove();if(a&&a.run===ON.run)hostWrite(a)});ON.roff.push(()=>I.off("child_added",fi))}}
function hostWrite(a){a.run=ON.run;ON.seq++;ON.ref.child("r/"+ON.run+"/a/"+String(ON.seq).padStart(6,"0")).set(a)}
function submit(a){if(!ON||ON.run<0)return;if(ON.host)hostWrite(a);else{a.run=ON.run;ON.ref.child("r/"+ON.run+"/i").push(a)}}
function startTimer(){if(ON){if(ON.host)S.timer=setInterval(()=>submit({t:"tick"}),1000)}else S.timer=setInterval(tick,1000)}
function act(a){if(ON)submit(a);else applyAct(a)}
function doHint(i){const t=S.teams[i];if(!t||t.hints<1||t.locked||S.paused||S.over||!t.cur)return;t.hints--;const c=t.cur;
 if(c.opts){const w=c.opts.filter(o=>!o.ok&&!c.off.includes(o.id));if(w.length>1)c.off.push(w[RND()*w.length|0].id)}else t.fb={ok:null,msg:"تلميح: عدد حروف الإجابة "+c.q.correct.length};renderGame()}
function routeSel(v){if(S.mode==="maze"&&S.phase==="choose"&&!S.paused){S.gates=v==="1"?2:1;if(v==="1")S.teams[0].hints++;S.phase="q";S.msg="";renderGame()}}
function applyAct(a){if(!S)return;switch(a.t){
 case"a":handleAnswer(a.i,a.v);break;
 case"c":if(S.mode==="xo"&&S.phase==="place"&&S.turn===a.i&&!S.paused&&!S.over&&!S.ending&&S.board[a.c]===null)place(a.c,S.turn);break;
 case"s":if(S.turn===a.i)spin();break;case"r":if(S.turn===a.i)roll();break;case"u":routeSel(a.v);break;case"h":doHint(a.i);break;
 case"p":S.paused?resumeGame():pauseGame();break;case"tick":tick();break;
 case"f":{const f=S.pend[a.k];if(f){delete S.pend[a.k];f()}break}}}
function leaveOnline(keep,msg){if(ON){ON.offs.concat(ON.roff||[]).forEach(f=>f());try{if(ON.host){ON.ref.remove();ON.lob.remove()}else{ON.ref.child("req/"+ON.key).remove();if(ON.acc)ON.ref.child("guest").remove()}}catch(e){}}ON=null;clearAllTimers();S=null;RND=Math.random;goState();if(!keep)show("setup");else if(msg){show("setup");ost(msg)}if(V("pm")==="online")startLobby()}
function boardNew(T){const cur=T[S.turn],q=S.phase==="q",sc=`<div class="hint" style="text-align:center">`+T.map(t=>`<b style="color:${t.color}">${t.sym} ${esc(t.name)} ★${t.score}</b>`).join(" · ")+`</div>`;let h="",ps="";
 if(S.mode==="wheel"){const L=["سهل","متوسط","صعب"];
  h=`<div class="card" style="text-align:center"><div class="ban" style="color:${cur.color}">دور: ${cur.sym} ${esc(cur.name)} · الجولة ${(cur.rounds||0)+1}/${S.rounds}</div><div class="wheelw"><div class="ptr">▼</div><div id="wheel" class="wheel" style="transform:rotate(${S.rot}deg)">${[0,1,2,3,4,5].map(i=>`<b style="transform:translate(-50%,-50%) rotate(${i*60+30}deg) translateY(-92px)${i*60+30>100&&i*60+30<260?" rotate(180deg)":""}">${L[i%3]}<br>${(i%3+1)*10}</b>`).join("")}</div></div>`+(S.phase==="spin"?`<button class="pri" data-spin ${S.paused||(ON&&S.turn!==ON.me)?"disabled":""}>🎡 أدر العجلة</button>`:S.phase==="spinning"?"<p>تدور…</p>":`<p class="hint">${L[S.seg%3]}: ${(S.seg%3+1)*10} نقاط</p>`)+sc+`</div>`;ps=q?panel(cur):""}
 else if(S.mode==="snake"){h=snakeBoard(T,cur,sc);ps=q?panel(cur):""}
 else{const t=cur;
  h=`<div class="card"><div style="display:flex;gap:6px;flex-wrap:wrap">`+[0,1,2,3,4].map(i=>`<div class="hint" style="text-align:center;flex:1">${i<t.pos?"✅":i===t.pos?"📍":"🔒"}<br>${i<4?"تقاطع "+(i+1):"🚪 الختامي"}</div>`).join("")+`</div><img src="${t.img}" alt="" style="height:70px;display:block;margin:6px auto"><p style="text-align:center;font-weight:800">${esc(S.msg||"")} بوابات متبقية: ${S.gates} · محاولات خاطئة: ${t.wrong}</p>`+(S.phase==="choose"?`<div class="g"><button class="pri" style="font-size:18px" data-route="0">🌲 الطريق القصير: بوابة واحدة</button><button class="pri" style="font-size:18px" data-route="1">🕳️ الطريق الطويل: بوابتان + تلميح إضافي</button></div>`:"")+`</div>`;ps=q||t.finished?(S.final&&!t.finished?'<div class="ban">⭐ السؤال الختامي</div>':"")+panel(t):""}
 return{h,ps}}
function useLesson(d){if(!d||!Array.isArray(d.questions)||!d.questions.length){$("#lstat").textContent="لا توجد أسئلة في الملف";return}
 Q=d.questions.map(q=>({type:q.type,text:q.text,correct:q.correct,wrong:q.wrong||[],exp:q.exp||"",diff:q.diff||2}));["subj","lesson","grade","summary"].forEach(k=>{if(d[k]!==undefined)$("#"+k).value=d[k]});$("#lstat").textContent="الدرس: "+(d.lesson||"")+" ("+Q.length+" سؤالًا)"}
async function loadLesson(){let d=null;try{const p=new URLSearchParams(location.search).get("lesson");if(p){d=await(await fetch(p)).json()}else if(location.hash.startsWith("#d="))d=JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(3)))))}catch(e){$("#lstat").textContent="تعذّر تحميل الدرس. تأكد من الرابط.";return}useLesson(d)}
document.addEventListener("DOMContentLoaded",initApp);if(document.readyState!=="loading")initApp();
})();
